name: Import Chatter Forum

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Get importer workflow
        uses: actions/checkout@v4

      - name: Download upstream source archive
        run: |
          mkdir upstream
          curl -L --fail --retry 3 https://codeload.github.com/thedevdojo/chatter/tar.gz/refs/heads/master \
            | tar -xz --strip-components=1 -C upstream

      - name: Preserve importer and add attribution
        run: |
          mkdir -p upstream/.github/workflows
          cp .github/workflows/import-chatter-forum.yml upstream/.github/workflows/import-chatter-forum.yml
          cat >> upstream/README.md <<'EOF'

          ---

          ## Amin4601 portfolio mirror

          This repository contains an imported source snapshot of [Chatter](https://github.com/thedevdojo/chatter), a Laravel forum package.
          The original project is by TheDevDojo and is distributed under the MIT License; the upstream LICENSE file is preserved.
          This is an independently maintained portfolio mirror by Amin4601, not a claim of original authorship.
          EOF

      - name: Create clean Git history and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd upstream
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Chatter Forum with upstream attribution"
          git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c http.version=HTTP/1.1 push destination HEAD:main --force
